# The demo's OpenID Connect provider: Keycloak in development mode, with the realm iqb-demo
# (client iqb-gate-demo, user anna / anna). Local only -- never a model for a real server.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: start-dev --import-realm --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/iqb-demo-realm.json:/opt/keycloak/data/import/iqb-demo-realm.json:ro
