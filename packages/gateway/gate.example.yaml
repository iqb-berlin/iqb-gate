# Mounted into the container and named by IQB_GATE_CONFIG, e.g. /etc/iqb-gate/gate.yaml.
# Without a file every request gets the default timeout and no write is checked.
# Unknown keys stop the gateway at start, so a misspelling cannot pass unnoticed.

# Path prefixes with an upstream of their own; everything else goes to IQB_GATE_UPSTREAM, and so
# do WebSockets. studio-lite: the API straight to the backend, as Traefik routed it before.
# upstreams and timeouts are the proxy's: behind Traefik's ForwardAuth, without IQB_GATE_UPSTREAM,
# they stop the gateway at start, as there is nothing they could apply to.
upstreams:
  - { prefix: /api, upstream: 'http://backend:3333' }

timeouts:
  # Seconds the app may stay silent before the gateway answers 504 -- like nginx's
  # proxy_read_timeout, not a limit on the whole transfer: an upload that keeps moving may
  # take longer.
  default: 600
  paths:
    # coding-box: workspace imports and exports run long
    - prefix: /api/admin/workspace
      seconds: 1800

# The challenge a session solves once for the write and the read gate. Each one costs the gateway a
# key derivation, so a client address gets this many a minute (429 beyond); a class behind one
# school address asks at once. Behind a proxy, IQB_GATE_TRUST_PROXY has to name it -- otherwise
# every client has the proxy's address and shares this limit.
challenges:
  perAddressAndMinute: 120

# Writes (POST, PUT, PATCH, DELETE) that have to come from a person. Needs IQB_GATE_SECRET;
# IQB_GATE_ENFORCE=off switches every check off (e.g. for Cypress runs).
writeGate:
  # A write whose path matches one of the regular expressions is checked (case does not matter,
  # and the path is matched as sent and as the application reads it). The first matching rule
  # decides, for each of the two spellings; the write is checked when either rule is on.
  # IQB_GATE_RULES_OFF=workspace switches one off for an installation.
  rules:
    - { name: administration, path: '^/api/(admin|group-admin|workspace-groups)/' }
    - { name: workspace, path: '^/api/workspaces/[^/]+(/|$)' }
  # Never checked; every condition an entry names has to hold.
  exempt:
    - { method: POST, path: '^/api/workspaces/[^/]+/download-units$' }
    - { method: PATCH, path: '^/api/workspaces/[^/]+/units/[^/]+/comments$' }
    # Script tokens the application checks itself (studio-lite: sl_...)
    - { bearerPrefix: 'sl_' }
  # More writes than this within the window ask the session for a new challenge.
  burst: { limit: 30, windowSeconds: 60 }
  # The claim of the Bearer JWT the audit log names the writer by -- unverified, see the audit page.
  userClaim: username

# Reads (GET, HEAD) that have to come from a person's browser: the session solved a challenge --
# the one of its login counts -- and the browser does not report automation. Needs IQB_GATE_SECRET;
# IQB_GATE_READ_RULES_OFF switches rules off by name, independent of the write rules.
readGate:
  rules:
    - { name: workspace, path: '^/api/workspaces/' }
    - { name: other, path: '^/api/' }
  # Never checked: what a page reads before the login, and files a script tag loads (no report)
  exempt:
    - { path: '^/api/admin/settings/(config|app-logo)$' }
    - { path: '^/api/packages/' }
    - { bearerPrefix: 'sl_' }
  # More reads than this within the window ask the session for a new challenge.
  limit: { limit: 600, windowSeconds: 60 }
  userClaim: username

# Pages opened in a browser over HTTPS solve a proof-of-work once, as with Anubis, before they are
# delivered; the browser then holds a pass for passDays. Off unless enabled. Behind a proxy that
# ends TLS, IQB_GATE_TRUST_PROXY has to name it -- otherwise no request counts as HTTPS.
pageGate:
  enabled: false
  passDays: 7
  # A class behind one school address opens its pages at once.
  challengesPerAddressAndMinute: 120
  # First match decides (allow, deny or challenge); without a match, a page is challenged. Every
  # condition an entry names has to hold.
  policy:
    - { name: ai-crawlers, userAgent: '(GPTBot|CCBot|ClaudeBot|Bytespider|PerplexityBot)', action: deny }
    - { name: uptime, userAgent: '^UptimeRobot/', path: '^/$', action: allow }
  # What the interstitial and the denied page say; German by default. Any of them can be replaced.
  # texts:
  #   lang: en
  #   title: One moment, please …
  #   continue: Continue

# The OpenID Connect provider whose tokens name the writers in the audit log, as checked ("geprüft").
# Without it, a writer is named by writeGate.userClaim from the token, unchecked. The gateway never
# lets a write through or keeps it out because of a token; the application decides that.
# oidc:
#   issuer: https://login.example.org/realms/iqb
#   clientId: studio            # required: the client the tokens have to be for
